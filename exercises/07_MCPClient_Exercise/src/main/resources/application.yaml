spring:
  application:
    name: 10_MCPClient

  ai:
    ollama:
      chat:
        model: qwen3
    openai:
      api-key: ${MyVerySecretChatGptKey}
      chat:
        options:
          model: gpt-5
    mcp:
      client:
        sse:
          connections:
            server1:
              url: http://localhost:7070

  mvc:
    log-request-details: true

logging:
    level:
      org:
        springframework:
          ai: DEBUG
          web: DEBUG


server:
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
