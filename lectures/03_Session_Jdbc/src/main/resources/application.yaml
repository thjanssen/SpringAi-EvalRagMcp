spring:
  application:
    name: 03_Session_Jdbc

  # file-based H2 database, so the sessions survive a restart of the application
  datasource:
    url: jdbc:h2:file:./data/sessions

  # shows the session tables at http://localhost:8080/h2-console
  # (JDBC URL: jdbc:h2:file:./data/sessions, user: sa, no password)
  h2:
    console:
      enabled: true

  ai:
    ollama:
      chat:
        model: gemma3
    session:
      repository:
        jdbc:
          # creates the AI_SESSION, AI_SESSION_INDEX and AI_SESSION_EVENT tables
          # on startup (the default only does this for in-memory databases)
          initialize-schema: always
#    openai:
#      api-key: ${MyVerySecretChatGptKey}

  mvc:
    log-request-details: true

logging:
    level:
      org:
        springframework:
          ai: DEBUG
          web: DEBUG

server:
  error:
    include-message: always